
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gobus-backend
  namespace: gobus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gobus-backend
  template:
    metadata:
      labels:
        app: gobus-backend
    spec:
      containers:
        - name: gobus-backend
          image: rishi784/gha:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

