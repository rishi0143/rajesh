
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gobus-hpa
  namespace: gobus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gobus-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

