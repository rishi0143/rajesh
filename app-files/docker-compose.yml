services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: gobus-backend:latest
    container_name: bus-backend
    restart: unless-stopped
    env_file:
      - admin.env
      - db.env
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
