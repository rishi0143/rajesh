
name: GoBus-KubeCI-CD-Monitoring

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8t/deployment.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gobus-main-pipeline
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: gobus-eks
  DOCKER_IMAGE: rishi784/gha-pyapp
  NAMESPACE: gobus
  MANIFEST_FILE: k8t/deployment.yaml

jobs:

  # ==========================================
  # JOB 1: BUILD AND PUSH DOCKER IMAGE
  # ==========================================
  PythonCI:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set Image Tag
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          IMAGE="${DOCKER_IMAGE}:${IMAGE_TAG}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          echo "Expected image: ${IMAGE}"

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./app-files
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Verify Docker Image
        run: |
          IMAGE="${DOCKER_IMAGE}:${IMAGE_TAG}"

          echo "===== DOCKER IMAGE ====="
          echo "Expected image: ${IMAGE}"

          docker buildx imagetools inspect "${IMAGE}"

          echo "Docker image verification successful"

      # ========================================
      # UPDATE KUBERNETES MANIFEST
      # ========================================
      - name: Install yq
        run: |
          sudo wget -q \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
            -O /usr/local/bin/yq

          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update Kubernetes Deployment Manifest
        run: |
          IMAGE="${DOCKER_IMAGE}:${IMAGE_TAG}"

          yq -i \
            '(.spec.template.spec.containers[] | select(.name == "pyapp").image) = strenv(IMAGE)' \
            "$MANIFEST_FILE"

          echo "===== UPDATED MANIFEST ====="
          yq '.spec.template.spec.containers[] | select(.name == "pyapp").image' "$MANIFEST_FILE"

      - name: Commit and Push Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$MANIFEST_FILE"

          if git diff --cached --quiet; then
            echo "Manifest already updated"
          else
            git commit -m "Update GoBus image to ${IMAGE}"
            git push origin HEAD:main
          fi

      # ========================================
      # GET LATEST GITHUB REVISION
      # ========================================
      - name: Get Latest Git Revision
        id: revision
        run: |
          git fetch origin main

          REVISION=$(git ls-remote origin refs/heads/main | awk '{print $1}')

          if [ -z "$REVISION" ]; then
            echo "Git revision not found"
            exit 1
          fi

          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "Expected revision: ${REVISION}"

  # ==========================================
  # JOB 2: VERIFY DEPLOYMENT AND MONITORING
  # ==========================================
  VerifyDeployment:
    name: Verify Deployment and Monitoring
    runs-on: ubuntu-latest
    needs: PythonCI

    env:
      EXPECTED_REVISION: ${{ needs.PythonCI.outputs.revision }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ========================================
      # AWS CREDENTIALS
      # ========================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ========================================
      # CONNECT TO EKS
      # ========================================
      - name: Connect to EKS Cluster
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          echo "===== EKS NODES ====="
          kubectl get nodes

      # ========================================
      # ARGO CD VERIFICATION
      # ========================================
      - name: Verify Argo CD Sync and Health
        run: |
          echo "===== ARGO CD VERIFICATION ====="

          EXPECTED_IMAGE="${DOCKER_IMAGE}:${GITHUB_SHA:0:7}"

          echo "Expected image: ${EXPECTED_IMAGE}"

          kubectl annotate application gobus \
            -n argocd \
            argocd.argoproj.io/refresh=hard \
            --overwrite

          SUCCESS=false

          for i in $(seq 1 30); do

            SYNC_STATUS=$(kubectl get application gobus \
              -n argocd \
              -o jsonpath='{.status.sync.status}' 2>/dev/null || true)

            HEALTH_STATUS=$(kubectl get application gobus \
              -n argocd \
              -o jsonpath='{.status.health.status}' 2>/dev/null || true)

            ACTUAL_REVISION=$(kubectl get application gobus \
              -n argocd \
              -o jsonpath='{.status.sync.revision}' 2>/dev/null || true)

            ACTUAL_IMAGE=$(kubectl get deployment pyapp \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="pyapp")].image}' \
              2>/dev/null || true)

            echo "Attempt: $i"
            echo "Sync: $SYNC_STATUS"
            echo "Health: $HEALTH_STATUS"
            echo "Revision: $ACTUAL_REVISION"
            echo "Expected image: $EXPECTED_IMAGE"
            echo "Actual image: $ACTUAL_IMAGE"

            if [ "$SYNC_STATUS" = "Synced" ] && \
               [ "$HEALTH_STATUS" = "Healthy" ] && \
               [ "$ACTUAL_IMAGE" = "$EXPECTED_IMAGE" ]; then

              SUCCESS=true
              break
            fi

            sleep 10
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "Argo CD verification failed"
            kubectl describe application gobus -n argocd || true
            exit 1
          fi

          echo "Argo CD verification successful"

      # ========================================
      # KUBERNETES DEPLOYMENT
      # ========================================
      - name: Verify Kubernetes Deployment
        run: |
          echo "===== KUBERNETES DEPLOYMENT ====="

          EXPECTED_IMAGE="${DOCKER_IMAGE}:${GITHUB_SHA:0:7}"

          kubectl rollout status deployment/pyapp \
            -n "$NAMESPACE" \
            --timeout=300s

          ACTUAL_IMAGE=$(kubectl get deployment pyapp \
            -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="pyapp")].image}')

          echo "Expected image: $EXPECTED_IMAGE"
          echo "Actual image: $ACTUAL_IMAGE"

          if [ "$ACTUAL_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "Image verification failed"
            exit 1
          fi

          echo "Image verification successful"

          echo "===== DEPLOYMENT ====="
          kubectl get deployment pyapp -n "$NAMESPACE"

          echo "===== PODS ====="
          kubectl get pods -n "$NAMESPACE" -o wide

          echo "===== SERVICES ====="
          kubectl get services -n "$NAMESPACE"

      # ========================================
      # HPA VERIFICATION
      # ========================================
      - name: Verify HPA
        run: |
          echo "===== HPA VERIFICATION ====="

          kubectl get hpa gobus-hpa -n "$NAMESPACE"

          kubectl describe hpa gobus-hpa -n "$NAMESPACE"

          METRICS_OK=false

          for i in $(seq 1 6); do
            if kubectl top pods -n "$NAMESPACE"; then
              METRICS_OK=true
              break
            fi

            echo "Metrics not ready. Retrying..."
            sleep 10
          done

          if [ "$METRICS_OK" != "true" ]; then
            echo "HPA metrics verification failed"
            exit 1
          fi

          echo "HPA verification successful"

      # ========================================
      # PROMETHEUS VERIFICATION
      # ========================================
      - name: Verify Prometheus
        run: |
          echo "===== PROMETHEUS VERIFICATION ====="

          kubectl get statefulset \
            prometheus-gobus-monitoring-kube-prom-prometheus \
            -n monitoring

          kubectl get service \
            gobus-monitoring-kube-prom-prometheus \
            -n monitoring

          kubectl rollout status \
            statefulset/prometheus-gobus-monitoring-kube-prom-prometheus \
            -n monitoring \
            --timeout=180s

          echo "Prometheus verification successful"

      # ========================================
      # GRAFANA VERIFICATION
      # ========================================
      - name: Verify Grafana
        run: |
          echo "===== GRAFANA VERIFICATION ====="

          kubectl get deployment \
            gobus-monitoring-grafana \
            -n monitoring

          kubectl get service \
            gobus-monitoring-grafana \
            -n monitoring

          kubectl rollout status \
            deployment/gobus-monitoring-grafana \
            -n monitoring \
            --timeout=180s

          echo "Grafana verification successful"

      # ========================================
      # FINAL PROJECT STATUS
      # ========================================
      - name: Final Project Status
        if: always()
        run: |
          echo "===== EKS NODES ====="
          kubectl get nodes || true

          echo "===== GOBUS DEPLOYMENTS ====="
          kubectl get deployments -n gobus || true

          echo "===== GOBUS PODS ====="
          kubectl get pods -n gobus -o wide || true

          echo "===== HPA ====="
          kubectl get hpa -n gobus || true

          echo "===== ARGO CD APPLICATIONS ====="
          kubectl get applications -n argocd || true

          echo "===== MONITORING PODS ====="
          kubectl get pods -n monitoring || true
