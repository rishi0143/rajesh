
name: GoBus-KubeCI-CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8t/deployment.yaml"

  workflow_dispatch:

permissions:
  contents: write

env:
  DOCKER_IMAGE: rishi784/gha-pyapp
  MANIFEST_FILE: k8t/deployment.yaml
  NAMESPACE: gobus

jobs:
  PythonCI:
    name: GoBus Docker ArgoCD CI-CD
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Source Code
      - name: Git Checkout
        uses: actions/checkout@v4

      # 2. Generate Image Version
      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            -t "$DOCKER_IMAGE:$IMAGE_TAG" \
            -t "$DOCKER_IMAGE:latest" \
            ./app-files

      # 5. Push Docker Image
      - name: Push Docker Image
        run: |
          docker push "$DOCKER_IMAGE:$IMAGE_TAG"
          docker push "$DOCKER_IMAGE:latest"

      # 6. Install yq
      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      # 7. Update Kubernetes Deployment Image
      - name: Update Deployment Version
        run: |
          IMAGE="$DOCKER_IMAGE:$IMAGE_TAG" \
          yq -i \
            '(.spec.template.spec.containers[] | select(.name == "pyapp").image) = strenv(IMAGE)' \
            "$MANIFEST_FILE"

          echo "Updated image:"
          yq '.spec.template.spec.containers[] | select(.name == "pyapp").image' "$MANIFEST_FILE"

      # 8. Commit Updated Manifest
      - name: Commit and Push Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$MANIFEST_FILE"

          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi

          git commit -m "Deploy GoBus version $IMAGE_TAG"
          git push origin HEAD:main

      # 9. Pipeline Summary
      - name: Pipeline Summary
        run: |
          echo "================================"
          echo "GoBus CI completed successfully"
          echo "Docker Image: $DOCKER_IMAGE:$IMAGE_TAG"
          echo "Manifest: $MANIFEST_FILE"
          echo "Namespace: $NAMESPACE"
          echo "Argo CD will sync the new version"
          echo "================================"
