
```yaml
name: GoBus-KubeCI-CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8t/deployment.yaml"

  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: gobus-eks
  DOCKER_IMAGE: rishi784/gha-pyapp
  NAMESPACE: gobus
  MANIFEST_FILE: k8t/deployment.yaml

jobs:

  # JOB 1: Docker Build, Push and GitOps Update
  PythonCI:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate Image Version
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE=$DOCKER_IMAGE:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t "$IMAGE" ./app-files

      - name: Push Docker Image
        run: |
          docker push "$IMAGE"
          docker tag "$IMAGE" "$DOCKER_IMAGE:latest"
          docker push "$DOCKER_IMAGE:latest"

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update Kubernetes Deployment Image
        run: |
          export IMAGE
          yq -i '(.spec.template.spec.containers[] | select(.name == "pyapp").image) = strenv(IMAGE)' "$MANIFEST_FILE"
          cat "$MANIFEST_FILE"

      - name: Commit and Push Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$MANIFEST_FILE"

          if ! git diff --cached --quiet; then
            git commit -m "Update GoBus image to $IMAGE_TAG"
            git push origin HEAD:main
          else
            echo "No manifest changes"
          fi

  # JOB 2: EKS, Argo CD and HPA Verification
  VerifyDeployment:
    name: Verify EKS Deployment and HPA
    runs-on: ubuntu-latest
    needs: PythonCI

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl

      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Verify EKS Connection
        run: |
          kubectl get nodes

      # Wait until Argo CD applies the new image
      - name: Wait for Argo CD Image Update
        run: |
          EXPECTED_IMAGE="$DOCKER_IMAGE:${GITHUB_SHA::7}"
          echo "Expected image: $EXPECTED_IMAGE"

          IMAGE_UPDATED=false

          for i in $(seq 1 60); do
            CURRENT_IMAGE=$(kubectl get deployment pyapp \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="pyapp")].image}' \
              2>/dev/null || true)

            echo "Attempt $i | Current image: $CURRENT_IMAGE"

            if [ "$CURRENT_IMAGE" = "$EXPECTED_IMAGE" ]; then
              echo "SUCCESS: Expected image is deployed"
              IMAGE_UPDATED=true
              break
            fi

            sleep 10
          done

          if [ "$IMAGE_UPDATED" != "true" ]; then
            echo "ERROR: Expected image was not deployed"
            exit 1
          fi

      # Verify application rollout
      - name: Verify Kubernetes Rollout
        run: |
          kubectl rollout status deployment/pyapp \
            -n "$NAMESPACE" \
            --timeout=5m

      # Verify deployment image
      - name: Verify Final Image
        run: |
          EXPECTED_IMAGE="$DOCKER_IMAGE:${GITHUB_SHA::7}"

          CURRENT_IMAGE=$(kubectl get deployment pyapp \
            -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="pyapp")].image}')

          echo "Expected: $EXPECTED_IMAGE"
          echo "Deployed: $CURRENT_IMAGE"

          test "$CURRENT_IMAGE" = "$EXPECTED_IMAGE"

      # Verify Kubernetes resources
      - name: Verify Pods and Deployment
        run: |
          kubectl get pods -n "$NAMESPACE"
          kubectl get deployment pyapp -n "$NAMESPACE"

      # Verify HPA
      - name: Verify HPA
        run: |
          kubectl get hpa -n "$NAMESPACE"
          kubectl top pods -n "$NAMESPACE"

      # Verify Argo CD
      - name: Verify Argo CD Application
        run: |
          kubectl get applications -n argocd
```
