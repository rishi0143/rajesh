
name: GoBus-KubeCI-CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8t/deployment.yaml"

  workflow_dispatch:
    inputs:
      install_monitoring:
        description: "Install Prometheus and Grafana"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: gobus-eks
  DOCKER_IMAGE: rishi784/gha-pyapp
  MANIFEST_FILE: k8t/deployment.yaml
  NAMESPACE: gobus

jobs:

  # =====================================
  # JOB 1: DOCKER BUILD AND GITOPS UPDATE
  # =====================================

  PythonCI:
    name: GoBus Docker CI and ArgoCD CD
    runs-on: ubuntu-latest

    steps:

      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t "$DOCKER_IMAGE:$IMAGE_TAG" \
            -t "$DOCKER_IMAGE:latest" \
            ./app-files

      - name: Push Docker Image
        run: |
          docker push "$DOCKER_IMAGE:$IMAGE_TAG"
          docker push "$DOCKER_IMAGE:latest"

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Validate Deployment Manifest
        run: |
          test -f "$MANIFEST_FILE"

          yq -e \
            '.spec.template.spec.containers[] | select(.name == "pyapp")' \
            "$MANIFEST_FILE" > /dev/null

      - name: Update Kubernetes Image Version
        run: |
          IMAGE="$DOCKER_IMAGE:$IMAGE_TAG" \
          yq -i \
            '(.spec.template.spec.containers[] | select(.name == "pyapp").image) = strenv(IMAGE)' \
            "$MANIFEST_FILE"

          echo "Updated image:"
          yq '.spec.template.spec.containers[] | select(.name == "pyapp").image' "$MANIFEST_FILE"

      - name: Commit and Push Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$MANIFEST_FILE"

          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi

          git commit -m "Deploy GoBus version $IMAGE_TAG"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: CI Summary
        run: |
          echo "GoBus Docker CI completed"
          echo "Image: $DOCKER_IMAGE:$IMAGE_TAG"
          echo "Manifest: $MANIFEST_FILE"
          echo "Argo CD will sync the new version"

  # =====================================
  # JOB 2: PROMETHEUS AND GRAFANA
  # =====================================

  Monitoring:
    name: Install Prometheus and Grafana
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch' && inputs.install_monitoring == true

    env:
      MONITORING_NAMESPACE: monitoring

    steps:

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl get nodes

      - name: Create Monitoring Namespace
        run: |
          kubectl create namespace "$MONITORING_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Add Prometheus Helm Repository
        run: |
          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts

          helm repo update

      - name: Install Prometheus and Grafana
        run: |
          helm upgrade --install gobus-monitoring \
            prometheus-community/kube-prometheus-stack \
            --namespace "$MONITORING_NAMESPACE" \
            --wait \
            --timeout 15m

      - name: Verify Monitoring
        run: |
          kubectl get pods -n monitoring
          kubectl get svc -n monitoring

      - name: Monitoring Summary
        run: |
          echo "Prometheus and Grafana installation completed"
          echo "Namespace: monitoring"
          echo "Helm Release: gobus-monitoring"
