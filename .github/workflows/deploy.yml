
name: GoBus-CI-ArgoCD-CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8t/deployment.yaml"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOCKER_IMAGE: rishi784/gobus-app
  MANIFEST_FILE: k8t/deployment.yaml

jobs:
  build-and-update:
    name: Build, Push and Update Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Version
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t "$DOCKER_IMAGE:$IMAGE_TAG" \
            -t "$DOCKER_IMAGE:latest" \
            ./app-files

      - name: Push Docker Image
        run: |
          docker push "$DOCKER_IMAGE:$IMAGE_TAG"
          docker push "$DOCKER_IMAGE:latest"

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update Kubernetes Deployment Version
        run: |
          IMAGE="$DOCKER_IMAGE:$IMAGE_TAG" \
          yq -i \
            '(.spec.template.spec.containers[0].image) = strenv(IMAGE)' \
            "$MANIFEST_FILE"

          echo "Updated image:"
          yq '.spec.template.spec.containers[0].image' "$MANIFEST_FILE"

      - name: Commit and Push Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$MANIFEST_FILE"

          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi

          git commit -m "Deploy GoBus version $IMAGE_TAG"
          git push origin HEAD:main
