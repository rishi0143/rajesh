```yaml
name: GoBus-KubeCI-CD-Monitoring

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8t/deployment.yaml"

  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: gobus-eks
  DOCKER_IMAGE: rishi784/gha-pyapp
  NAMESPACE: gobus
  MANIFEST_FILE: k8t/deployment.yaml

jobs:

  # JOB 1: Build Docker Image, Push and Update GitOps Manifest
  PythonCI:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate Image Version
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE=$DOCKER_IMAGE:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t "$IMAGE" ./app-files

      - name: Push Docker Image
        run: |
          docker push "$IMAGE"
          docker tag "$IMAGE" "$DOCKER_IMAGE:latest"
          docker push "$DOCKER_IMAGE:latest"

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update Kubernetes Deployment Image
        run: |
          export IMAGE
          yq -i '(.spec.template.spec.containers[] | select(.name == "pyapp").image) = strenv(IMAGE)' "$MANIFEST_FILE"
          cat "$MANIFEST_FILE"

      - name: Commit and Push Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$MANIFEST_FILE"

          if ! git diff --cached --quiet; then
            git commit -m "Update GoBus image to $IMAGE_TAG"
            git push origin HEAD:main
          else
            echo "No manifest changes to commit"
          fi

  # JOB 2: Install or Upgrade Prometheus and Grafana
  Monitoring:
    name: Install Prometheus and Grafana
    runs-on: ubuntu-latest
    needs: PythonCI

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GoBusMonitoringSession

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Verify EKS Connection
        run: |
          kubectl get nodes

      - name: Create Monitoring Namespace
        run: |
          kubectl create namespace monitoring \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Add Prometheus Helm Repository
        run: |
          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Install or Upgrade Prometheus and Grafana
        run: |
          helm upgrade --install gobus-monitoring \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --wait \
            --timeout 15m

      - name: Verify Monitoring
        run: |
          kubectl get pods -n monitoring
          kubectl get svc -n monitoring
          helm list -n monitoring

  # JOB 3: Verify Deployment, HPA and Argo CD
  VerifyDeployment:
    name: Verify EKS Deployment and HPA
    runs-on: ubuntu-latest
    needs:
      - PythonCI
      - Monitoring

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GoBusDeploySession

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl

      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Verify EKS Connection
        run: |
          kubectl get nodes

      - name: Wait for Argo CD Image Update
        env:
          EXPECTED_IMAGE: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        run: |
          EXPECTED_IMAGE="$DOCKER_IMAGE:${GITHUB_SHA::7}"
          echo "Expected image: $EXPECTED_IMAGE"

          for i in $(seq 1 60); do
            CURRENT_IMAGE=$(kubectl get deployment pyapp \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="pyapp")].image}' \
              2>/dev/null || true)

            echo "Current image: $CURRENT_IMAGE"

            if [ "$CURRENT_IMAGE" = "$EXPECTED_IMAGE" ]; then
              echo "Argo CD updated the deployment image successfully"
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for Argo CD image update"
          exit 1

      - name: Verify Kubernetes Rollout
        run: |
          kubectl rollout status deployment/pyapp \
            -n "$NAMESPACE" \
            --timeout=5m

      - name: Verify Pods and HPA
        run: |
          kubectl get pods -n "$NAMESPACE"
          kubectl get deployment -n "$NAMESPACE"
          kubectl get hpa -n "$NAMESPACE"
          kubectl top pods -n "$NAMESPACE"

      - name: Verify Argo CD Application
        run: |
          kubectl get applications -n argocd
          kubectl get application -n argocd --no-headers

      - name: Verify Monitoring Components
        run: |
          kubectl get pods -n monitoring
          kubectl get svc -n monitoring
```
