
name: GoBus-Docker-EKS-HPA-CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: gobus-eks
  DOCKER_IMAGE: rishi784/gha
  NAMESPACE: gobus

jobs:
  build-and-deploy:
    name: Build and Deploy GoBus
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Generate image tag
      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # 3. Docker Hub login
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t "$DOCKER_IMAGE:$IMAGE_TAG" \
            -f app-files/Dockerfile \
            app-files

      # 5. Push Docker image
      - name: Push Docker Image
        run: |
          docker push "$DOCKER_IMAGE:$IMAGE_TAG"

          docker tag "$DOCKER_IMAGE:$IMAGE_TAG" "$DOCKER_IMAGE:latest"

          docker push "$DOCKER_IMAGE:latest"

      # 6. Configure AWS credentials using IAM User
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 7. Verify AWS identity
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # 8. Install kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      # 9. Connect to EKS
      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl get nodes

      # 10. Create namespace
      - name: Create Namespace
        run: |
          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      # 11. Create RDS database secret
      - name: Configure Database Secret
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_NAME" ] || \
             [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Database GitHub Secrets are missing."
            exit 1
          fi

          kubectl create secret generic gobus-db-secret \
            -n "$NAMESPACE" \
            --from-literal=DB_HOST="$DB_HOST" \
            --from-literal=DB_NAME="$DB_NAME" \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      # 12. Install Metrics Server
      - name: Install Metrics Server
        run: |
          kubectl apply -f \
            https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

          kubectl rollout status deployment/metrics-server \
            -n kube-system \
            --timeout=180s

      # 13. Deploy Kubernetes manifests
      - name: Deploy GoBus Application
        run: |
          kubectl apply -f k8t/deployment.yaml -n "$NAMESPACE"
          kubectl apply -f k8t/service.yaml -n "$NAMESPACE"

      # 14. Update Docker image
      - name: Update GoBus Image
        run: |
          kubectl set image deployment/gobus-backend \
            gobus-backend="$DOCKER_IMAGE:$IMAGE_TAG" \
            -n "$NAMESPACE"

      # 15. Verify rollout
      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/gobus-backend \
            -n "$NAMESPACE" \
            --timeout=300s

      # 16. Apply HPA
      - name: Apply HPA
        run: |
          kubectl apply -f k8t/hpa.yaml -n "$NAMESPACE"

      # 17. Final verification
      - name: Final Verification
        run: |
          echo "===== AWS IDENTITY ====="
          aws sts get-caller-identity

          echo "===== EKS NODES ====="
          kubectl get nodes

          echo "===== GOBUS PODS ====="
          kubectl get pods -n "$NAMESPACE" -o wide

          echo "===== GOBUS SERVICES ====="
          kubectl get svc -n "$NAMESPACE"

          echo "===== HPA ====="
          kubectl get hpa -n "$NAMESPACE"

          echo "===== POD METRICS ====="
          kubectl top pods -n "$NAMESPACE" || true

      # 18. Debug when pipeline fails
      - name: Debug Failure
        if: failure()
        run: |
          kubectl get pods -n "$NAMESPACE" -o wide || true

          kubectl get events -n "$NAMESPACE" \
            --sort-by=.lastTimestamp || true

          kubectl get hpa -n "$NAMESPACE" || true

          kubectl logs deployment/gobus-backend \
            -n "$NAMESPACE" \
            --all-containers=true \
            --tail=100 || true
