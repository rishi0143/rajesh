
name: KubeCI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: gobus-eks
  DOCKER_IMAGE: rishi784/gha-pyapp
  NAMESPACE: default

jobs:
  PythonCI:
    name: Python Docker EKS HPA CI-CD
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t "$DOCKER_IMAGE:$IMAGE_TAG" .
          docker tag "$DOCKER_IMAGE:$IMAGE_TAG" "$DOCKER_IMAGE:latest"

      - name: Push Docker Image
        run: |
          docker push "$DOCKER_IMAGE:$IMAGE_TAG"
          docker push "$DOCKER_IMAGE:latest"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

          CALLER_ARN=$(aws sts get-caller-identity --query Arn --output text)

          if [ "$CALLER_ARN" != "arn:aws:iam::479537130944:user/gobus-github-deploy" ]; then
            echo "Wrong IAM User"
            exit 1
          fi

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl get nodes

      - name: Deploy Python Application
        run: |
          kubectl apply -f k8s/deployment.yaml -n "$NAMESPACE"

          kubectl set image deployment/pyapp \
            pyapp="$DOCKER_IMAGE:$IMAGE_TAG" \
            -n "$NAMESPACE"

          kubectl rollout status deployment/pyapp \
            -n "$NAMESPACE" \
            --timeout=300s

      - name: Install Metrics Server
        run: |
          kubectl apply -f \
            https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

      - name: Verify Metrics Server
        run: |
          kubectl rollout status deployment/metrics-server \
            -n kube-system \
            --timeout=180s

      - name: Wait for Metrics API
        run: |
          for i in {1..18}; do
            if kubectl top nodes; then
              echo "Metrics API is ready"
              exit 0
            fi

            echo "Waiting for Metrics API..."
            sleep 10
          done

          echo "Metrics API is not ready"
          exit 1

      - name: Apply HPA
        run: |
          kubectl apply -f k8s/hpa.yaml -n "$NAMESPACE"

      - name: Verify HPA
        run: |
          kubectl get hpa -n "$NAMESPACE"
          kubectl describe hpa pyapp-hpa -n "$NAMESPACE"

      - name: Final Verification
        run: |
          echo "===== EKS Nodes ====="
          kubectl get nodes

          echo "===== Application Pods ====="
          kubectl get pods -n "$NAMESPACE"

          echo "===== Deployment ====="
          kubectl get deployment pyapp -n "$NAMESPACE"

          echo "===== Metrics Server ====="
          kubectl get deployment metrics-server -n kube-system

          echo "===== HPA ====="
          kubectl get hpa -n "$NAMESPACE"

          echo "===== Pod Metrics ====="
          kubectl top pods -n "$NAMESPACE"

      - name: Debug Failure
        if: failure()
        run: |
          kubectl get nodes || true
          kubectl get pods -n "$NAMESPACE" -o wide || true
          kubectl get hpa -n "$NAMESPACE" || true
          kubectl get events -n "$NAMESPACE" \
            --sort-by=.lastTimestamp || true
          kubectl logs deployment/pyapp \
            -n "$NAMESPACE" --tail=100 || true
