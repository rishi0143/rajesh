
name: GoBus-KubeCI-CD-Monitoring

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8t/deployment.yaml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gobus-main-pipeline
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: gobus-eks
  DOCKER_IMAGE: rishi784/gha-pyapp
  NAMESPACE: gobus
  MANIFEST_FILE: k8t/deployment.yaml

jobs:

  # JOB 1: BUILD AND PUSH DOCKER IMAGE
  PythonCI:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build.outputs.image }}
      revision: ${{ steps.update_manifest.outputs.revision }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate Image Tag
        id: build
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          IMAGE="${DOCKER_IMAGE}:${IMAGE_TAG}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t "$IMAGE" ./app-files
          docker push "$IMAGE"

          docker tag "$IMAGE" "$DOCKER_IMAGE:latest"
          docker push "$DOCKER_IMAGE:latest"

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64

          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update Kubernetes Deployment Image
        id: update_manifest
        run: |
          export IMAGE

          yq -i '(.spec.template.spec.containers[] |
            select(.name == "pyapp").image) = strenv(IMAGE)' \
            "$MANIFEST_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$MANIFEST_FILE"

          if ! git diff --cached --quiet; then
            git commit -m "Update GoBus image to $IMAGE_TAG"
          fi

          git push origin HEAD:main

          REVISION=$(git ls-remote origin refs/heads/main | awk '{print $1}')

          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

          echo "Updated image: $IMAGE"
          echo "Git revision: $REVISION"


  # JOB 2: VERIFY EKS, ARGO CD, HPA AND MONITORING
  VerifyDeployment:
    name: Verify EKS and Monitoring
    runs-on: ubuntu-latest
    needs: PythonCI

    steps:

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

          kubectl get nodes

      # ARGO CD VERIFICATION
      - name: Verify Argo CD Application
        env:
          EXPECTED_REVISION: ${{ needs.PythonCI.outputs.revision }}
        run: |
          echo "===== ARGO CD ====="

          kubectl annotate application gobus -n argocd \
            argocd.argoproj.io/refresh=hard --overwrite

          for i in $(seq 1 30); do

            SYNC=$(kubectl get application gobus -n argocd \
              -o jsonpath='{.status.sync.status}')

            HEALTH=$(kubectl get application gobus -n argocd \
              -o jsonpath='{.status.health.status}')

            REVISION=$(kubectl get application gobus -n argocd \
              -o jsonpath='{.status.sync.revision}')

            echo "Sync: $SYNC | Health: $HEALTH"
            echo "Revision: $REVISION"

            if [ "$SYNC" = "Synced" ] && \
               [ "$HEALTH" = "Healthy" ] && \
               [ "$REVISION" = "$EXPECTED_REVISION" ]; then
              echo "Argo CD verification successful"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Argo CD verification failed"
              kubectl describe application gobus -n argocd
              exit 1
            fi

            sleep 10
          done

      # KUBERNETES DEPLOYMENT VERIFICATION
      - name: Verify Kubernetes Deployment
        env:
          EXPECTED_IMAGE: ${{ needs.PythonCI.outputs.image }}
        run: |
          echo "===== KUBERNETES DEPLOYMENT ====="

          kubectl rollout status deployment/pyapp \
            -n "$NAMESPACE" --timeout=300s

          ACTUAL_IMAGE=$(kubectl get deployment pyapp \
            -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="pyapp")].image}')

          echo "Expected image: $EXPECTED_IMAGE"
          echo "Actual image: $ACTUAL_IMAGE"

          if [ "$ACTUAL_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "Image verification failed"
            exit 1
          fi

          kubectl get deployment pyapp -n "$NAMESPACE"
          kubectl get pods -n "$NAMESPACE" -o wide
          kubectl get svc -n "$NAMESPACE"

      # HPA VERIFICATION
      - name: Verify HPA Autoscaling
        run: |
          echo "===== HPA STATUS ====="

          kubectl get hpa gobus-hpa -n "$NAMESPACE"

          kubectl describe hpa gobus-hpa -n "$NAMESPACE"

          echo "===== WAITING FOR CPU METRICS ====="

          METRICS_READY=false

          for i in $(seq 1 6); do
            if kubectl top pods -n "$NAMESPACE"; then
              METRICS_READY=true
              break
            fi

            echo "Waiting for CPU metrics..."
            sleep 10
          done

          if [ "$METRICS_READY" != "true" ]; then
            echo "CPU metrics are unavailable"
            exit 1
          fi

          kubectl get hpa gobus-hpa -n "$NAMESPACE"

      # PROMETHEUS VERIFICATION
      - name: Verify Prometheus
        run: |
          echo "===== PROMETHEUS ====="

          kubectl get statefulset \
            prometheus-gobus-monitoring-kube-prom-prometheus \
            -n monitoring

          kubectl get svc \
            gobus-monitoring-kube-prom-prometheus \
            -n monitoring

          kubectl rollout status \
            statefulset/prometheus-gobus-monitoring-kube-prom-prometheus \
            -n monitoring --timeout=180s

      # GRAFANA VERIFICATION
      - name: Verify Grafana
        run: |
          echo "===== GRAFANA ====="

          kubectl get deployment \
            gobus-monitoring-grafana \
            -n monitoring

          kubectl get svc \
            gobus-monitoring-grafana \
            -n monitoring

          kubectl rollout status \
            deployment/gobus-monitoring-grafana \
            -n monitoring --timeout=180s

      # FINAL STATUS
      - name: Final Project Status
        run: |
          echo "===== GOBUS FINAL STATUS ====="

          kubectl get nodes
          kubectl get deployment -n gobus
          kubectl get pods -n gobus
          kubectl get hpa -n gobus
          kubectl get applications -n argocd
          kubectl get pods -n monitoring

          echo "GoBus CI/CD verification completed!"
