
name: KubeCI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: gobus-eks
  DOCKER_IMAGE: rishi784/gha-pyapp
  NAMESPACE: default

jobs:
  PythonCI:
    name: Python Docker EKS HPA CI-CD
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub Repository
      - name: Git Checkout
        uses: actions/checkout@v4

      # 2. Generate Docker Image Tag
      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # 3. Docker Hub Login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t "$DOCKER_IMAGE:$IMAGE_TAG" .
          docker tag "$DOCKER_IMAGE:$IMAGE_TAG" "$DOCKER_IMAGE:latest"

      # 5. Push Docker Image
      - name: Push Docker Image
        run: |
          docker push "$DOCKER_IMAGE:$IMAGE_TAG"
          docker push "$DOCKER_IMAGE:latest"

      # 6. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 7. Verify AWS Identity
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account --output text)

          if [ "$ACCOUNT_ID" != "479537130944" ]; then
            echo "Wrong AWS Account!"
            exit 1
          fi

          CALLER_ARN=$(aws sts get-caller-identity \
            --query Arn --output text)

          echo "AWS Identity: $CALLER_ARN"

          if [ "$CALLER_ARN" != \
            "arn:aws:iam::479537130944:user/gobus-github-deploy" ]; then
            echo "Wrong IAM User!"
            exit 1
          fi

      # 8. Setup kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      # 9. Connect to EKS
      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl get nodes

      # 10. Install Metrics Server
      - name: Install Metrics Server
        run: |
          kubectl apply -f \
            https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

      # 11. Verify Metrics Server
      - name: Verify Metrics Server
        run: |
          kubectl rollout status deployment/metrics-server \
            -n kube-system \
            --timeout=180s

          kubectl get deployment metrics-server \
            -n kube-system

      # 12. Wait for Metrics API
      - name: Wait for Metrics API
        run: |
          for i in {1..12}; do
            if kubectl top nodes; then
              echo "Metrics API is ready"
              exit 0
            fi

            echo "Waiting for Metrics Server..."
            sleep 10
          done

          echo "Metrics API is not ready"
          exit 1

      # 13. Deploy Python Application
      - name: Deploy Python Application
        run: |
          kubectl apply -f k8s/deployment.yaml \
            -n "$NAMESPACE"

          kubectl apply -f k8s/service.yaml \
            -n "$NAMESPACE"

      # 14. Update Application Image
      - name: Update Application Image
        run: |
          kubectl set image deployment/pyapp \
            pyapp="$DOCKER_IMAGE:$IMAGE_TAG" \
            -n "$NAMESPACE"

      # 15. Verify Application Deployment
      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/pyapp \
            -n "$NAMESPACE" \
            --timeout=300s

      # 16. Apply HPA
      - name: Apply HPA
        run: |
          kubectl apply -f k8s/hpa.yaml \
            -n "$NAMESPACE"

      # 17. Verify HPA
      - name: Verify HPA
        run: |
          kubectl get hpa -n "$NAMESPACE"

          kubectl describe hpa pyapp-hpa \
            -n "$NAMESPACE"

      # 18. Final Verification
      - name: Final Verification
        run: |
          echo "===== AWS EKS Nodes ====="
          kubectl get nodes

          echo "===== Application Pods ====="
          kubectl get pods -n "$NAMESPACE" -o wide

          echo "===== Services ====="
          kubectl get svc -n "$NAMESPACE"

          echo "===== HPA Status ====="
          kubectl get hpa -n "$NAMESPACE"

          echo "===== Pod CPU and Memory ====="
          kubectl top pods -n "$NAMESPACE" || true

      # 19. Debug if Pipeline Fails
      - name: Debug Failure
        if: failure()
        run: |
          kubectl get nodes || true

          kubectl get pods \
            -n "$NAMESPACE" -o wide || true

          kubectl get svc \
            -n "$NAMESPACE" || true

          kubectl get events \
            -n "$NAMESPACE" \
            --sort-by=.lastTimestamp || true

          kubectl get hpa \
            -n "$NAMESPACE" || true

          kubectl logs deployment/pyapp \
            -n "$NAMESPACE" \
            --tail=100 || true
