
name: GoBus-KubeCI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: gobus-eks
  DOCKER_IMAGE: rishi784/gha

jobs:
  build-and-deploy:
    name: Build, Push and Deploy GoBus
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure AWS OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Docker Hub login
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build Docker image
      - name: Build Docker Image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker build -t $DOCKER_IMAGE:$SHORT_SHA .
          docker tag $DOCKER_IMAGE:$SHORT_SHA $DOCKER_IMAGE:latest

      # 5. Push Docker image
      - name: Push Docker Image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker push $DOCKER_IMAGE:$SHORT_SHA
          docker push $DOCKER_IMAGE:latest

      # 6. Install kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      # 7. Connect to AWS EKS
      - name: Update EKS Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # 8. Install Metrics Server
      - name: Install Metrics Server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

          kubectl rollout status deployment/metrics-server \
            -n kube-system --timeout=180s

      # 9. Create namespace
      - name: Create Namespace
        run: |
          kubectl apply -f k8t/namespace.yaml

      # 10. Deploy application
      - name: Deploy GoBus Application
        run: |
          kubectl apply -f k8t/deployment.yaml
          kubectl apply -f k8t/service.yaml

          SHORT_SHA=${GITHUB_SHA::7}

          kubectl set image deployment/gobus-backend \
            gobus-backend=$DOCKER_IMAGE:$SHORT_SHA \
            -n gobus

          kubectl rollout status deployment/gobus-backend \
            -n gobus --timeout=180s

      # 11. Configure HPA
      - name: Configure HPA
        run: |
          kubectl apply -f k8t/hpa.yaml

      # 12. Verify deployment
      - name: Verify GoBus Deployment
        run: |
          echo "===== EKS Nodes ====="
          kubectl get nodes

          echo "===== GoBus Pods ====="
          kubectl get pods -n gobus -o wide

          echo "===== GoBus Services ====="
          kubectl get svc -n gobus

          echo "===== HPA Status ====="
          kubectl get hpa -n gobus

          echo "===== CPU and Memory Metrics ====="
          kubectl top pods -n gobus || true

      # 13. Show logs when pipeline fails
      - name: Debug Kubernetes Failure
        if: failure()
        run: |
          kubectl get pods -n gobus -o wide || true
          kubectl get events -n gobus --sort-by=.lastTimestamp || true
          kubectl describe pods -n gobus || true
          kubectl logs deployment/gobus-backend \
            -n gobus --all-containers=true --tail=100 || true
